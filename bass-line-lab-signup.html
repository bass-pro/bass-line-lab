  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --white: #FFFFFF;
      --black: #0D0D0D;
      --text: #1A1A1A;
      --grey: #8A8A8A;
      --border: #E0E0E0;
      --blue: #3B5BFF;
      --red: #FF4400;
      --red-dark: #E03A00;
      --yellow: #FFD600;
    }

    body {
      background: var(--white);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-weight: 400;
      line-height: 1.65;
    }

    h1, h2, h3 { font-family: 'Oswald', sans-serif; }

    /* ============ HERO ============ */
    .hero {
      background: var(--black);
      position: relative;
      min-height: auto;
      display: flex;
      align-items: flex-start;
      padding-bottom: 40px;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('photo-3.jpg');
      background-repeat: no-repeat;
      background-position: center 30%;
      background-size: cover;
      opacity: 0.4;
      z-index: 0;
    }

    .hero-inner {
      max-width: 920px;
      margin: 0 auto;
      padding: 40px 48px 0;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .brand-mark {
      display: block;
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 48px;
    }

    .brand-mark .bm-bass {
      display: inline-block;
      border-bottom: 2px solid var(--blue);
      padding-bottom: 4px;
    }

    .brand-mark .bm-line {
      color: var(--blue);
    }

    .hero-headline {
      font-size: clamp(36px, 5vw, 54px);
      font-weight: 700;
      line-height: 1.0;
      letter-spacing: -1.5px;
      color: var(--white);
      text-transform: uppercase;
      margin-bottom: 32px;
      order: 1;
    }

    .hero-split {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .hero-copy {
      flex: 1;
      min-width: 0;
      padding-bottom: 0;
      order: 2;
    }

    .hero-headline .accent { color: var(--red); }

    .hero-pain {
      font-family: 'Lato', sans-serif;
      font-size: clamp(20px, 2.8vw, 28px);
      font-weight: 400;
      color: rgba(255,255,255,0.85);
      line-height: 1.65;
      margin-bottom: 32px;
      letter-spacing: -0.3px;
    }

    .hero-pain span {
      display: block;
      margin-bottom: 8px;
    }

    .hero-pain span:last-child { margin-bottom: 0; }

    .hero-bridge {
      margin-top: 16px;
      margin-bottom: 56px;
      font-family: 'Oswald', sans-serif;
      font-size: clamp(16px, 2.2vw, 22px);
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--white);
    }

    .hero-bridge .accent {
      color: var(--red);
    }

    .hero-photo {
      display: none;
    }

    /* ============ FORM SECTION ============ */
    .form-section {
      background: var(--white);
      padding: 12px 32px 16px;
    }

    .form-inner {
      max-width: 520px;
      margin: 0 auto;
    }

    .form-eyebrow {
      font-family: 'Oswald', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 4px;
      text-align: center;
    }

    .form-fields {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      font-family: 'Lato', sans-serif;
      font-size: 15px;
      color: var(--text);
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 2px;
      outline: none;
      transition: border-color 0.18s;
    }

    .form-input::placeholder { color: var(--grey); }
    .form-input:focus { border-color: var(--text); }

    .form-btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 2px;
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.18s;
    }

    .form-btn:hover { background: var(--red-dark); }

    .form-note {
      font-size: 11px;
      color: var(--grey);
      text-align: center;
      margin-top: 4px;
      letter-spacing: 0.2px;
    }

    /* ============ CREDIBILITY ============ */
    .credibility {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--grey);
      letter-spacing: 0.2px;
      line-height: 1.5;
      text-align: center;
    }

    .credibility strong {
      color: var(--text);
      font-weight: 700;
    }

    /* ============ FOOTER ============ */
    footer {
      text-align: center;
      padding: 24px 32px;
      font-size: 13px;
      color: var(--grey);
      border-top: 1px solid var(--border);
    }

    footer a { color: var(--grey); text-decoration: none; }
    footer a:hover { color: var(--text); }


    /* ============ RESPONSIVE ============ */
    @media (max-width: 640px) {
      .hero {
        min-height: auto;
        padding-bottom: 20px;
      }

      .hero::before {
        opacity: 0.25;
      }

      .hero-inner { padding: 14px 12px 0; }
      .form-section { padding: 8px 12px 12px; }

      .brand-mark { margin-bottom: 16px; font-size: 11px; }

      .hero-headline {
        font-size: clamp(28px, 7vw, 36px);
        margin-bottom: 16px;
      }

      .hero-split { gap: 0; }

      .hero-copy { padding-bottom: 0; }

      .hero-pain { font-size: 17px; margin-bottom: 12px; }

      .hero-pain span { margin-bottom: 6px; }

      .hero-bridge { margin-top: 12px; margin-bottom: 24px; font-size: 13px; }

      .form-inner { max-width: 100%; }

      .form-input { padding: 12px 12px; font-size: 15px; }

      .form-btn { font-size: 15px; padding: 12px 16px; }
    }
  </style>
